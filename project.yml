# xcodegen の設定。Xcode プロジェクトはここから生成する (手で .xcodeproj を編集しない)。
# 課題アプリ (Exp2Task、iPad) とゲームアプリ (Exp2Game、研究室の iPhone) の2つ (2台版) と、1台版 (Exp2Single、iPad) を含む。
#   xcodegen generate
# 署名は無料の Apple アカウント (Personal Team) で行う。DEVELOPMENT_TEAM はそのアカウントの Team ID。
# ここに書いておかないと、xcodegen generate のたびに Xcode で選んだ署名の設定が消える。
name: Exp2Task
options:
  bundleIdPrefix: com.ryogashimizu
  deploymentTarget:
    iOS: "17.0"
packages:
  ExperimentCore:
    path: Packages/ExperimentCore
targets:
  Exp2Task:
    type: application
    platform: iOS
    sources:
      # 音声ガイドのファイル (App/SpeechAudio) は公開しないので、プロジェクトに名前を載せず、
      # 下の postCompileScripts でビルドのたびにアプリへ写す (app_decisions #75。1台版と同じ)
      - path: App
        excludes:
          - SpeechAudio
      - Shared
    dependencies:
      - package: ExperimentCore
        product: ExperimentCore
      - package: ExperimentCore
        product: RecordingCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 実験2課題
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # 時計を見せない (設計書5章)。ステータスバーの時刻をすべての画面で隠す
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # 説明の画面の字 (視認性の高い UD フォント、SIL OFL。App/Fonts、app_decisions #69)
        UIAppFonts:
          - BIZUDPGothic-Regular.ttf
          - BIZUDPGothic-Bold.ttf
        # 書き出したファイルをファイルアプリの「この iPad 内」から見られるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # AirPods の頭の動きの記録 (開発用モードの記録テスト、app_decisions #71)
        NSMotionUsageDescription: 頭の動きを記録するため、AirPods の動きを読み取ります
        # スタンドに横置き (docs/app_decisions.md #18)。左右どちら向きに置いても使えるよう横向き2つを許す
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryogashimizu.Exp2Task
        # アプリのアイコン (Assets.xcassets/AppIcon、図形だけで描いたもの)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QN3FXYZSB3
        GENERATE_INFOPLIST_FILE: NO
        # 下のスクリプトが、名前を決めずにフォルダの中身を読むため
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: 音声ガイドのファイルを写す
        basedOnDependencyAnalysis: false
        script: |
          # App/SpeechAudio の mp3 を、アプリの中の SpeechAudio に写す (公開しないファイルなので git には入れない)。
          # フォルダがない、または空なら警告を出し、音声なしのアプリになる (記録開始の前の画面に出る)
          SRC="${SRCROOT}/App/SpeechAudio"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/SpeechAudio"
          rm -rf "${DST}"
          mkdir -p "${DST}"
          if ls "${SRC}"/*.mp3 >/dev/null 2>&1; then
            cp "${SRC}"/*.mp3 "${DST}/"
          else
            echo "warning: 音声ガイドのファイルがありません (${SRC})"
          fi
  # シミュレータで画面を通しで操作する UI テスト (UITests/SessionFlowUITests.swift)
  Exp2TaskUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Exp2Task
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryogashimizu.Exp2TaskUITests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QN3FXYZSB3
        GENERATE_INFOPLIST_FILE: YES
  # ゲームアプリ (研究室の iPhone 12 Pro)。設計書4章・9.2章
  Exp2Game:
    type: application
    platform: iOS
    sources: [GameApp, Shared]
    dependencies:
      - package: ExperimentCore
        product: GameCore
      - package: ExperimentCore
        product: RecordingCore
    info:
      path: GameApp/Info.plist
      properties:
        CFBundleDisplayName: 実験2ゲーム
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # 時計を見せない (設計書5章)。iPhone はステータスバーに時刻が出るので、すべての画面で隠す
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # 書き出したファイルをファイルアプリの「この iPhone 内」から見られるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 机に画面を上にして置き、手に持って遊ぶ。縦向きに固定する
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: スマホを手に持っているかを調べるため、iPhone の動きを記録します
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryogashimizu.Exp2Game
        # アプリのアイコン (Assets.xcassets/AppIcon、図形だけで描いたもの)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QN3FXYZSB3
        GENERATE_INFOPLIST_FILE: NO
  # シミュレータで画面を通しで操作する UI テスト (GameUITests/GameFlowUITests.swift)
  Exp2GameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GameUITests]
    dependencies:
      - target: Exp2Game
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryogashimizu.Exp2GameUITests
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QN3FXYZSB3
        GENERATE_INFOPLIST_FILE: YES
  # 1台版 (iPad 1台で、計算問題の途中にゲームが割り込む形式)。docs/context_exp2_ipad_only.md、docs/single_decisions.md
  # 2台版の課題アプリと同じ iPad に並べて入れる。bundle ID が違うので、データの保存場所 (Documents) も分かれる。
  # 2台版の画面の部品はファイルを写さずに参照する (説明の画面、出題とテンキー、AirPods の記録、ゲームの色と形、タッチの記録)
  Exp2Single:
    type: application
    platform: iOS
    sources:
      # 音声ガイドのファイル (SingleApp/SpeechAudio) は公開しないので、プロジェクトに名前を載せず、
      # 下の postCompileScripts でビルドのたびにアプリへ写す (single_decisions S53)
      - path: SingleApp
        excludes:
          - SpeechAudio
      - Shared
      - App/GuideViews.swift
      - App/ProblemView.swift
      - App/EndInputView.swift
      - App/HeadphoneMotionRecorder.swift
      - App/Chime.swift
      - App/Fonts
      - GameApp/GameViews.swift
      - GameApp/TouchObserver.swift
      # 2台版と共通の、音声ガイドの再生と、ゲームの効果音・操作のガイド (2026-11-08 に共通にした)
      - App/SpeechGuidePlayer.swift
      - GameApp/GameSound.swift
      - GameApp/GameGuideOverlay.swift
    dependencies:
      - package: ExperimentCore
        product: SingleCore
      - package: ExperimentCore
        product: ExperimentCore
      - package: ExperimentCore
        product: GameCore
      - package: ExperimentCore
        product: RecordingCore
    info:
      path: SingleApp/Info.plist
      properties:
        CFBundleDisplayName: 実験2一台
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # 時計を見せない (設計書5章)。ステータスバーの時刻をすべての画面で隠す
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # 説明の画面の字 (課題アプリと同じ BIZ UDPゴシック、App/Fonts)
        UIAppFonts:
          - BIZUDPGothic-Regular.ttf
          - BIZUDPGothic-Bold.ttf
        # 書き出したファイルをファイルアプリの「この iPad 内」から見られるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMotionUsageDescription: 頭の動きを記録するため、AirPods の動きを読み取ります
        # スタンドに横置き (課題アプリと同じ)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryogashimizu.Exp2Single
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QN3FXYZSB3
        GENERATE_INFOPLIST_FILE: NO
        # 下のスクリプトが、名前を決めずにフォルダの中身を読むため
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: 音声ガイドのファイルを写す
        basedOnDependencyAnalysis: false
        script: |
          # SingleApp/SpeechAudio の mp3 を、アプリの中の SpeechAudio に写す (公開しないファイルなので git には入れない)。
          # フォルダがない、または空なら警告を出し、音声なしのアプリになる (記録開始の前の画面に出る)
          SRC="${SRCROOT}/SingleApp/SpeechAudio"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/SpeechAudio"
          rm -rf "${DST}"
          mkdir -p "${DST}"
          if ls "${SRC}"/*.mp3 >/dev/null 2>&1; then
            cp "${SRC}"/*.mp3 "${DST}/"
          else
            echo "warning: 音声ガイドのファイルがありません (${SRC})"
          fi
  # シミュレータで画面を通しで操作する UI テスト (SingleUITests/SingleFlowUITests.swift)
  Exp2SingleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SingleUITests]
    dependencies:
      - target: Exp2Single
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryogashimizu.Exp2SingleUITests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QN3FXYZSB3
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Exp2Task:
    build:
      targets:
        Exp2Task: all
    test:
      targets:
        - package: ExperimentCore/ExperimentCoreTests
        - Exp2TaskUITests
  Exp2Game:
    build:
      targets:
        Exp2Game: all
    test:
      targets:
        - package: ExperimentCore/GameCoreTests
        - Exp2GameUITests
  Exp2Single:
    build:
      targets:
        Exp2Single: all
    test:
      targets:
        - package: ExperimentCore/SingleCoreTests
        - Exp2SingleUITests
